<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab AI Showdown: Team Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--deep:#0B1622;--panel:#16263A;--mint:#91E2CE;--teal:#006C68;--light:#F4F7F6;--muted:#B8C7CF;
--A:#D64545;--B:#2F6FD6;--C:#D99A00;--D:#2E8B3E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--light);font-family:Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
#app{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:#070E16;gap:12px;flex-wrap:wrap}
.brand{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:22px}
.brand span{color:var(--mint)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tb{background:#1B2B40;border:1px solid #2C3E56;color:var(--light);border-radius:10px;padding:8px 14px;font-weight:600;font-size:15px}
.tb:hover{background:#24395A}
.main{flex:1;display:flex;flex-direction:column;padding:28px clamp(16px,3vw,48px);gap:24px}
h1{font-family:"Space Grotesk",sans-serif;font-size:clamp(40px,6vw,88px);line-height:1;margin:0}
.kick{color:var(--mint);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:clamp(14px,1.3vw,20px)}
.btn{border:none;border-radius:14px;padding:16px 28px;font-weight:800;font-size:clamp(18px,1.6vw,24px);background:var(--mint);color:var(--ink)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:#24395A;color:var(--light)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
.game{background:var(--panel);border-radius:22px;padding:28px;text-align:left;border:2px solid transparent;color:var(--light)}
.game:hover{border-color:var(--mint)}
.game b{display:block;font-family:"Space Grotesk",sans-serif;font-size:clamp(26px,2.6vw,40px);margin:6px 0}
.game small{color:var(--muted);font-size:17px}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.teams input{width:100%;background:#0E1C2C;border:1.5px solid #2C3E56;border-radius:10px;padding:10px 12px;color:var(--light);font:inherit;font-size:17px}
.panel{background:var(--panel);border-radius:20px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qnum{font-weight:800;color:var(--muted);font-size:clamp(16px,1.4vw,22px)}
.question{background:var(--light);color:var(--ink);border-radius:22px;padding:clamp(18px,2.4vw,36px);font-weight:800;font-size:clamp(26px,3.3vw,56px);line-height:1.15;text-align:center}
.scene{background:#0E1C2C;border:1.5px solid #2C3E56;border-radius:18px;padding:18px 22px;font-size:clamp(18px,1.7vw,28px);line-height:1.35;color:#DCE6EB}
.scene svg{vertical-align:middle}
.timer{width:clamp(90px,8vw,140px);height:clamp(90px,8vw,140px);border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(34px,3.6vw,60px);font-family:"Space Grotesk",sans-serif;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1}
.tile{border-radius:18px;padding:clamp(14px,1.6vw,26px);display:flex;align-items:center;gap:20px;font-weight:800;font-size:clamp(22px,2.4vw,42px);color:#fff;min-height:clamp(90px,12vh,170px);transition:opacity .3s,transform .3s}
.tile .sh{flex:none;width:clamp(48px,4.4vw,80px);height:clamp(48px,4.4vw,80px)}
.tile .lt{flex:none;font-family:"Space Grotesk",sans-serif;font-size:clamp(28px,2.6vw,46px);opacity:.85}
.tile.A{background:var(--A)}.tile.B{background:var(--B)}.tile.C{background:var(--C)}.tile.D{background:var(--D)}
.tile.dim{opacity:.22}
.tile.win{outline:6px solid #fff;transform:scale(1.02)}
.tile.win::after{content:"✓";margin-left:auto;font-size:clamp(36px,3.4vw,64px)}
.explain{background:#0E2A2A;border-left:8px solid var(--mint);border-radius:14px;padding:18px 22px;font-size:clamp(18px,1.7vw,28px);line-height:1.35}
.score-ui h3{margin:0 0 10px;font-size:clamp(16px,1.4vw,22px);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:2px solid #3A4E6A;background:#0E1C2C;color:var(--light);border-radius:999px;padding:10px 18px;font-weight:700;font-size:clamp(16px,1.4vw,22px)}
.chip.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.chip.fast{background:#F2C14E;color:var(--ink);border-color:#F2C14E}
.board{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:60px minmax(140px,280px) 1fr 110px;gap:16px;align-items:center;font-size:clamp(20px,2vw,32px);font-weight:800}
.bar .rk{color:var(--muted);font-family:"Space Grotesk",sans-serif}
.bar .tr{height:clamp(26px,3.2vh,42px);background:#0E1C2C;border-radius:10px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--teal),var(--mint));border-radius:10px;transition:width .8s ease}
.bar .pt{text-align:right;font-family:"Space Grotesk",sans-serif}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:20px;margin-top:20px}
.pod{width:clamp(150px,18vw,280px);text-align:center}
.pod .blk{border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(40px,5vw,80px);color:var(--ink)}
.pod .nm{font-weight:800;font-size:clamp(20px,2vw,32px);margin-bottom:8px}
.pod .ps{color:var(--muted);font-weight:700;margin-bottom:10px;font-size:clamp(16px,1.4vw,22px)}
.hint{color:var(--muted);font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:9}
.modal .box{background:var(--panel);border-radius:18px;padding:26px;max-width:460px}
.bars-mini{display:grid;gap:8px;margin-top:10px}
.bm{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:clamp(15px,1.3vw,22px)}
.bm .t2{height:20px;background:#0E1C2C;border-radius:6px;overflow:hidden}.bm .f2{height:100%}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- shapes ----------
const SH={
 A:'<svg class="sh" viewBox="0 0 100 100"><polygon points="50,8 95,90 5,90" fill="#fff"/></svg>',
 B:'<svg class="sh" viewBox="0 0 100 100"><polygon points="50,4 96,50 50,96 4,50" fill="#fff"/></svg>',
 C:'<svg class="sh" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff"/></svg>',
 D:'<svg class="sh" viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" fill="#fff"/></svg>'};
const L="ABCD";
const cell=(k,col)=>{const c=col||"#7B4FA6";
 if(k==="R")return `<svg width="60" height="60" viewBox="0 0 70 70"><circle cx="35" cy="35" r="26" fill="#C9DDF2"/><circle cx="35" cy="35" r="15" fill="${c}"/></svg>`;
 if(k==="O")return `<svg width="60" height="60" viewBox="0 0 70 70"><ellipse cx="35" cy="35" rx="29" ry="20" fill="#C9DDF2"/><ellipse cx="35" cy="35" rx="17" ry="9" fill="${c}"/></svg>`;
 return `<svg width="60" height="60" viewBox="0 0 70 70"><circle cx="35" cy="35" r="27" fill="#C9DDF2"/><polygon points="35,14 40,29 56,29 43,38 48,54 35,44 22,54 27,38 14,29 30,29" fill="${c}"/></svg>`};
const miniBars=(rows)=>`<div class="bars-mini">${rows.map(([n,v])=>`<div class="bm"><span>${n}</span><div class="t2"><div class="f2" style="width:${v}%;background:${v>=90?'#2E8B3E':v>=75?'#D99A00':'#D64545'}"></div></div><b>${v}%</b></div>`).join("")}</div>`;

// ---------- content ----------
const GAMES=[
{id:"g1",title:"Who Does It?",sub:"Automation, AI, or a person? Plus: when to speak up.",time:20,qs:[
 {q:"Reading a tube's barcode to know whose sample it is",o:["Automation","AI","A person"],a:0,ex:"A scanner follows fixed steps. It doesn't learn or decide.",scene:"<b>Who does it?</b> Automation follows fixed steps. AI learns from examples. A person uses judgment and takes responsibility."},
 {q:"Moving tubes along a track to the right machine",o:["Automation","AI","A person"],a:0,ex:"Robotic tracks follow programmed routes. The first fully automated lab was built in Japan in the 1980s."},
 {q:"Looking at a photo of a blood cell and suggesting what type it is",o:["Automation","AI","A person"],a:1,ex:"This software learned from thousands of labeled pictures, which is what makes it AI. A trained person still checks its suggestions."},
 {q:"Deciding whether a lab rule should change after a mistake",o:["Automation","AI","A person"],a:2,ex:"Changing how the lab works is a responsibility for trained, accountable people."},
 {q:"Releasing a normal result that passes all of the lab's written rules",o:["Automation","AI","A person"],a:0,ex:"This is rule-based automation, called autoverification. People wrote the rules, and it checks only what the rules say."},
 {q:"Sorting photos of culture dishes into 'growth' and 'no growth'",o:["Automation","AI","A person"],a:1,ex:"AI plate readers learned patterns from example images. The first one was cleared by the FDA in 2019."},
 {q:"Telling the care team that a result looks wrong or dangerous",o:["Automation","AI","A person"],a:2,ex:"Software can raise an alert, but explaining the problem and making sure someone acts on it is a human job."},
 {q:"Which step comes FIRST in a lab test's journey?",o:["Run the test on an analyzer","Collect the sample","Spin the tube","Send the result"],a:1,ex:"Collect → label → transport → sort and spin → test → review → send."},
 {q:"Where does the largest share of lab errors happen?",o:["Before testing: collecting, labeling, transport","Inside the analyzer during the test","After the result is sent","Lab errors never happen"],a:0,ex:"Studies estimate that 30% to 86% of lab errors happen before testing. A tube that sits too long can change the result."},
 {q:"The machine sent a result automatically, but your team notices the tube was cracked. What do you do?",o:["Nothing. The machine approved it","Tell your supervisor right away","Fix the number yourself","Wait to see if anyone complains"],a:1,ex:"Software only checks what it was told to check. Anyone who notices a problem should raise it."},
 {q:"You're new. The AI says a cell is 'normal,' but it looks unusual to you. What do you do?",o:["Trust the AI. It's more experienced","Ask an experienced coworker to look","Delete the picture","Change the answer and tell no one"],a:1,ex:"Being new is a reason to ask, not to stay quiet. A second set of trained eyes catches mistakes."},
 {q:"Your lab wants to start using a new AI tool next week. What should happen first?",o:["Turn it on for all patients","Let the AI test itself","Test it in your lab and train staff on its limits","Skip training. AI doesn't need people"],a:2,ex:"Before patient use, the lab checks that the tool works under its own conditions, and staff learn where it can go wrong."}
]},
{id:"g2",title:"Train the AI",sub:"Build an AI that sorts cells, then decide how to keep patients safe.",time:25,qs:[
 {scene:`Your team is building an AI to sort cell pictures into three types:<br>${cell("R")} <b>Round</b> (very common) &nbsp; ${cell("O")} <b>Oval</b> (common) &nbsp; ${cell("S")} <b>Star</b> (rare, but a sign of serious illness)`,
  q:"How does an AI learn to tell these cells apart?",o:["Someone types a description of each cell","It studies many example pictures labeled by experts","It guesses until a patient complains","It copies answers from the internet"],a:1,ex:"Most AI used in labs learns patterns from many labeled examples. What it's good at depends on what it was shown."},
 {scene:"You can collect <b>1,000 training pictures</b>. Star cells are rare, so they're hard to find.",
  q:"Which training set will make the most reliable AI?",o:["980 Round, 20 Star","500 Round, 480 Oval, 20 Star","About 330 of each type","1,000 Star only"],a:2,
  ex:`Simulated results for the Star cell (illustrative numbers):${miniBars([["A: 20 Star",58],["B: 20 Star",58],["C: 330 Star",95],["D: Star only",95]])}<div style="margin-top:8px">Set D can't recognize Round or Oval cells at all. Set C is the only one that learns every type.</div>`},
 {q:"Another lab trained its AI on mostly Round cells. Which type will it get wrong most often?",o:["Round","Oval","Star","All equally"],a:2,ex:"With only a few examples to learn from, the AI is weakest on the rare Star cells."},
 {q:"Why does missing a Star cell matter more than missing a Round one?",o:["Star cells are prettier","Rare cells can be a sign of serious illness","Round cells don't matter at all","It doesn't matter"],a:1,ex:"Rare cases are often the ones that matter most, and they're where AI is usually weakest."},
 {scene:`The lab buys a <b>new camera</b>. Same cells, different look: ${cell("S","#7B4FA6")} old camera → ${cell("S","#C07AD8")} new camera`,
  q:"What will probably happen to the AI's accuracy?",o:["It goes up","It may drop, because the pictures look different from its training","It stays exactly the same","The AI refuses to work"],a:1,
  ex:`Simulated accuracy, trained on one camera only:${miniBars([["Old camera",95],["New camera",71]])}<div style="margin-top:8px">AI can struggle quietly when new inputs look different from what it learned on.</div>`},
 {q:"What would have prepared the AI for the new camera?",o:["Training on pictures from several cameras and stains","Training for more hours on the same pictures","Turning the screen brightness down","Nothing could help"],a:0,ex:"Variety in training data helps an AI handle the variety it will meet in real labs."},
 {q:"Which safety rule would you require before using this AI on patients?",o:["Use its answers with no human review","Let the AI check its own work","A trained person reviews every Star cell it finds","Turn it off whenever it's busy"],a:2,ex:"Rare, high-stakes calls get a human check."},
 {q:"The lab switches to a new brand of stain. What should happen first?",o:["Keep going. It passed testing before","Test the AI again before trusting it","Ask the AI if it's sure","Throw out the old results"],a:1,ex:"When conditions change, people check first and retest the tool."},
 {q:"True or false: an AI that scored 95% in testing will be 95% accurate in every lab.",o:["True","False"],a:1,ex:"Accuracy depends on conditions: cameras, stains, supplies, and patients. It has to be checked in each setting."},
 {q:"In 2021, the FDA authorized the first AI software to help pathologists find prostate cancer on slide images. How is it meant to be used?",o:["It replaces the pathologist","As a helper: it flags areas for the pathologist to review","Only for training students","Patients use it at home"],a:1,ex:"It's an assistant. A qualified pathologist still reviews the slides and makes the diagnosis."},
 {q:"Who is responsible for the results a lab reports?",o:["The AI","The company that sold the AI","The lab's trained professionals and leaders","No one"],a:2,ex:"Machines do the steps. People own the results."}
]}];

// ---------- state ----------
const KEY="labAIShowdown_v1";
let S;
function fresh(){return {screen:"home",nTeams:7,teams:Array.from({length:7},(_,i)=>`Team ${i+1}`),scores:Array(7).fill(0),gi:0,qi:0,phase:"ask",right:[],fast:null,secs:30,left:30,sound:true,done:[]}}
try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
if(!S.done)S.done=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let tick=null;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- sound ----------
let ac=null;function beep(f,d,v){if(!S.sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";g.gain.value=v||.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function chime(){[523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.35,.1),i*140))}

function topbar(){return `<div class="top"><div class="brand">🧪 Lab AI <span>Showdown</span></div><div class="tools">
 <button class="tb" data-act="board">🏆 Scores</button><button class="tb" data-act="sound">${S.sound?"🔊 Sound on":"🔇 Sound off"}</button>
 <button class="tb" data-act="full">⛶ Full screen</button><button class="tb" data-act="home">⌂ Menu</button></div></div>`}
function wireTop(){app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
 if(a==="sound"){S.sound=!S.sound;save();render()}
 if(a==="full"){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
 if(a==="home"){stop();S.screen="home";save();render()}
 if(a==="board"){stop();S.ret=S.screen;S.screen="board";save();render()}})}
function stop(){clearInterval(tick);tick=null}

// ---------- screens ----------
function home(){
 app.innerHTML=topbar()+`<div class="main">
 <div><div class="kick">Team game show · No devices needed</div><h1>Lab AI Showdown</h1></div>
 <div class="panel"><div class="row" style="justify-content:space-between"><b style="font-size:20px">How to play</b></div>
 <p style="font-size:clamp(17px,1.5vw,24px);line-height:1.45;margin:8px 0 0">Each team gets four answer cards: <b style="color:#FF8A80">▲ A red</b>, <b style="color:#8AB4FF">◆ B blue</b>, <b style="color:#FFD166">● C yellow</b>, <b style="color:#7FD68C">■ D green</b>. When the timer ends, every team holds up one card. Correct = <b>100 points</b>. The first team to raise a correct card earns <b>+50</b>.</p></div>
 <div class="games">${GAMES.map((g,i)=>`<button class="game" data-g="${i}"><span class="kick">Game ${i+1} · ${g.qs.length} questions · about ${g.time} min ${S.done.includes(g.id)?"· ✓ played":""}</span><b>${g.title}</b><small>${g.sub}</small></button>`).join("")}</div>
 <div class="panel"><div class="row" style="justify-content:space-between"><b style="font-size:20px">Teams</b>
 <div class="row"><label class="hint">Number of teams <select id="nt" style="font-size:16px;padding:4px;border-radius:6px">${[2,3,4,5,6,7,8,9,10].map(n=>`<option ${n===S.nTeams?"selected":""}>${n}</option>`).join("")}</select></label>
 <label class="hint">Seconds per question <select id="secs" style="font-size:16px;padding:4px;border-radius:6px">${[20,30,45,60].map(n=>`<option ${n===S.secs?"selected":""}>${n}</option>`).join("")}</select></label>
 <button class="tb" id="reset">Reset all scores</button></div></div>
 <div class="teams" style="margin-top:12px">${S.teams.slice(0,S.nTeams).map((t,i)=>`<input data-t="${i}" value="${esc(t)}" aria-label="Team ${i+1} name">`).join("")}</div>
 <p class="hint">Scores carry over between Game 1 and Game 2 for an overall champion. They're saved in this browser, so a refresh won't lose them.</p></div>
 </div>`;
 wireTop();
 app.querySelectorAll(".game").forEach(b=>b.onclick=()=>{S.gi=+b.dataset.g;S.qi=0;S.phase="ask";S.right=[];S.fast=null;S.left=S.secs;S.screen="q";save();render()});
 app.querySelector("#nt").onchange=e=>{const n=+e.target.value;S.nTeams=n;while(S.teams.length<n){S.teams.push(`Team ${S.teams.length+1}`);S.scores.push(0)}save();render()};
 app.querySelector("#secs").onchange=e=>{S.secs=+e.target.value;save()};
 app.querySelectorAll("[data-t]").forEach(i=>i.oninput=e=>{S.teams[+i.dataset.t]=e.target.value||`Team ${+i.dataset.t+1}`;save()});
 app.querySelector("#reset").onclick=()=>modal("Reset all scores to zero?",()=>{S.scores=S.scores.map(()=>0);S.done=[];save();render()});
}
function modal(msg,yes){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="box"><p style="font-size:20px;margin-top:0">${msg}</p><div class="row"><button class="btn" id="my">Yes</button><button class="btn alt" id="mn">Cancel</button></div></div>`;document.body.appendChild(m);m.querySelector("#my").onclick=()=>{m.remove();yes()};m.querySelector("#mn").onclick=()=>m.remove()}

function q(){
 const g=GAMES[S.gi],Q=g.qs[S.qi],rev=S.phase!=="ask";
 const n=Q.o.length;
 app.innerHTML=topbar()+`<div class="main">
 <div class="qhead"><span class="qnum">${g.title.toUpperCase()} · QUESTION ${S.qi+1} OF ${g.qs.length}</span>
 ${rev?"":`<div class="timer" id="tm" style="background:conic-gradient(var(--mint) ${S.left/S.secs*360}deg,#24395A 0)"><span style="background:var(--deep);width:78%;height:78%;border-radius:50%;display:grid;place-items:center">${S.left}</span></div>`}</div>
 ${Q.scene&&!rev?`<div class="scene">${Q.scene}</div>`:""}
 <div class="question">${Q.q}</div>
 <div class="tiles" style="${n===2?'grid-template-columns:1fr 1fr':''}">${Q.o.map((o,i)=>`<div class="tile ${L[i]} ${rev?(i===Q.a?'win':'dim'):''}"><span class="lt">${L[i]}</span>${SH[L[i]]}<span>${o}</span></div>`).join("")}</div>
 ${rev?`<div class="explain">${Q.ex}</div>
  <div class="panel score-ui"><h3>Tap every team that held up ${L[Q.a]} (+100)</h3><div class="chips">${S.teams.slice(0,S.nTeams).map((t,i)=>`<button class="chip ${S.right.includes(i)?'on':''}" data-r="${i}">${esc(t)}</button>`).join("")}</div>
  <h3 style="margin-top:16px">First correct team (+50)</h3><div class="chips">${S.teams.slice(0,S.nTeams).map((t,i)=>`<button class="chip ${S.fast===i?'fast':''}" data-f="${i}">⚡ ${esc(t)}</button>`).join("")}</div></div>
  <div class="row"><button class="btn" id="award">Award points & show scores ➜</button><span class="hint">Shortcut: Enter</span></div>`
 :`<div class="row"><button class="btn" id="start">${tick?"⏸ Pause":S.left<S.secs?"▶ Resume timer":"▶ Start timer"}</button><button class="btn alt" id="reveal">Reveal answer</button><span class="hint">Shortcuts: Space = start or pause · R = reveal</span></div>`}
 </div>`;
 wireTop();
 if(!rev){
  app.querySelector("#start").onclick=toggleTimer;
  app.querySelector("#reveal").onclick=reveal;
 }else{
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const i=+b.dataset.r;S.right=S.right.includes(i)?S.right.filter(x=>x!==i):[...S.right,i];if(S.fast!==null&&!S.right.includes(S.fast))S.fast=null;save();render()});
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{const i=+b.dataset.f;S.fast=S.fast===i?null:i;if(S.fast!==null&&!S.right.includes(i))S.right.push(i);save();render()});
  app.querySelector("#award").onclick=award;
 }
}
function toggleTimer(){
 if(tick){stop();render();return}
 if(S.left<=0)S.left=S.secs;
 tick=setInterval(()=>{S.left--;
  if(S.left<=5&&S.left>0)beep(880,.12);
  if(S.left<=0){stop();chime();reveal();return}
  const tm=document.getElementById("tm");if(tm){tm.style.background=`conic-gradient(var(--mint) ${S.left/S.secs*360}deg,#24395A 0)`;tm.querySelector("span").textContent=S.left}
 },1000);render()}
function reveal(){stop();S.phase="reveal";save();render()}
function award(){
 S.right.forEach(i=>S.scores[i]+=100);if(S.fast!==null)S.scores[S.fast]+=50;
 S.last={right:[...S.right],fast:S.fast};S.right=[];S.fast=null;S.ret="q-next";S.screen="board";save();render()}
function next(){const g=GAMES[S.gi];
 if(S.qi<g.qs.length-1){S.qi++;S.phase="ask";S.left=S.secs;S.screen="q"}
 else{if(!S.done.includes(g.id))S.done.push(g.id);S.screen="final"}
 save();render()}

function ranked(){return S.teams.slice(0,S.nTeams).map((t,i)=>({t,i,s:S.scores[i]})).sort((a,b)=>b.s-a.s)}
function board(){
 const r=ranked(),max=Math.max(100,...r.map(x=>x.s));
 const inGame=S.ret==="q-next";
 app.innerHTML=topbar()+`<div class="main">
 <div><div class="kick">${inGame?`After question ${S.qi+1} of ${GAMES[S.gi].qs.length}`:"Overall"}</div><h1>Leaderboard</h1></div>
 <div class="board">${r.map((x,k)=>`<div class="bar"><span class="rk">#${k+1}</span><span>${esc(x.t)}${S.last&&inGame&&S.last.fast===x.i?" ⚡":""}</span><div class="tr"><div class="fl" style="width:0%" data-w="${x.s/max*100}"></div></div><span class="pt">${x.s}</span></div>`).join("")}</div>
 <div class="row">${inGame?`<button class="btn" id="nx">${S.qi<GAMES[S.gi].qs.length-1?"Next question ➜":"Final results ➜"}</button><span class="hint">Shortcut: Enter</span>`:`<button class="btn" id="back">Back</button>`}</div></div>`;
 wireTop();
 requestAnimationFrame(()=>app.querySelectorAll(".fl").forEach(f=>f.style.width=f.dataset.w+"%"));
 const nx=app.querySelector("#nx");if(nx)nx.onclick=()=>{S.last=null;next()};
 const bk=app.querySelector("#back");if(bk)bk.onclick=()=>{S.screen=S.ret&&S.ret!=="board"&&S.ret!=="q-next"?S.ret:"home";save();render()};
}
function final(){
 const r=ranked(),g=GAMES[S.gi];chime();
 const order=[r[1],r[0],r[2]].filter(Boolean),h={0:"70%",1:"100%",2:"50%"};
 const cols=["#F2C14E","#C9D3DB","#D9A066"];
 app.innerHTML=topbar()+`<div class="main" style="align-items:center;text-align:center">
 <div><div class="kick">${g.title} complete · Scores so far</div><h1>🏆 ${esc(r[0].t)} leads!</h1></div>
 <div class="podium">${order.map(x=>{const pl=r.indexOf(x);return `<div class="pod"><div class="nm">${esc(x.t)}</div><div class="ps">${x.s} pts</div><div class="blk" style="height:${pl===0?260:pl===1?190:140}px;background:${cols[pl]}">${pl+1}</div></div>`}).join("")}</div>
 <div class="row" style="justify-content:center"><button class="btn" id="hm">Back to menu</button><button class="btn alt" id="bd">Full leaderboard</button></div></div>`;
 wireTop();
 app.querySelector("#hm").onclick=()=>{S.screen="home";save();render()};
 app.querySelector("#bd").onclick=()=>{S.ret="final";S.screen="board";save();render()};
}
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
 if(S.screen==="q"&&S.phase==="ask"){if(e.code==="Space"){e.preventDefault();toggleTimer()}if(e.key==="r"||e.key==="R")reveal()}
 else if(S.screen==="q"&&e.key==="Enter")award();
 else if(S.screen==="board"&&S.ret==="q-next"&&e.key==="Enter"){S.last=null;next()}
});
function render(){({home,q,board,final})[S.screen]()}
if(S.screen==="q"&&S.phase==="ask")S.left=S.left||S.secs;
render();
</script>
</body>
</html>
